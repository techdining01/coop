{% if toast_message %}
<div
    id="toast-container"
    hx-swap-oob="beforeend"
>
    <div
        x-data="coopToast('{{ toast_message|escapejs }}', '{{ toast_kind|default:"info" }}')"
        x-show="visible"
        x-transition
        x-init="init()"
        class="rounded-lg border px-4 py-3 text-sm shadow-lg flex items-start justify-between gap-3"
        :class="colorClasses()"
    >
        <span x-text="message"></span>
        <button @click="visible = false" class="opacity-70 hover:opacity-100" aria-label="Dismiss">&times;</button>
    </div>
</div>
{% endif %}
