services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"  # override via POSTGRES_PORT env if 5432 is in use

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"  # override via REDIS_PORT env if 6379 is in use

  web:
    build: .
    restart: unless-stopped
    entrypoint: /docker-entrypoint.sh db
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file: .env
    volumes:
      - ./mediafiles:/app/mediafiles
      - ./staticfiles:/app/staticfiles
      - ./backups:/app/backups
      - ./exports:/app/exports
    depends_on:
      - db
      - redis
    ports:
      - "127.0.0.1:8000:8000"  # nginx fronts this — not exposed directly

  worker:
    build: .
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file: .env
    volumes:
      - ./mediafiles:/app/mediafiles
      - ./backups:/app/backups
      - ./exports:/app/exports
    depends_on:
      - db
      - redis

  beat:
    build: .
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
