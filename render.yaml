# render.yaml — one-click deploy for Render
# Docs: https://render.com/docs/blueprint-spec
#
# ── How to deploy ───────────────────────────────────────────────────────────
#   1. Generate your secrets locally first:
#        python -c "import secrets; print(secrets.token_hex(50))"
#        python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#
#   2. Push this repo to GitHub.
#
#   3. Render dashboard → New → Blueprint → connect your repo.
#      Render reads this file and creates all services in one go.
#
#   4. Render will prompt you to fill in the variables marked `sync: false`
#      before the first deploy starts — paste your generated values there:
#        DJANGO_SECRET_KEY
#        FIELD_ENCRYPTION_KEY
#        PAYVESSEL_BASE_URL    (https://sandbox.payvessel.com for now)
#        PAYVESSEL_API_KEY
#        PAYVESSEL_API_SECRET
#        PAYVESSEL_BUSINESS_ID
#
#   5. After first deploy, create your superuser:
#      coop-web → Shell tab → python manage.py createsuperuser
# ────────────────────────────────────────────────────────────────────────────

services:
  # ── Web (Django + Gunicorn) ──────────────────────────────────────────────
  - type: web
    name: coop-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render always routes to port 10000 for Docker services
    dockerContext: .
    preDeployCommand: "python manage.py migrate --noinput && python manage.py setup_roles"
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: COOPERATIVE_SHORT_NAME
        value: AL-HALAL
      - key: DATABASE_URL
        fromDatabase:
          name: coop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: coop-redis
          type: redis
          property: connectionString
      # Secrets — Render will prompt for these values on first deploy
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: PAYVESSEL_BASE_URL
        sync: false
      - key: PAYVESSEL_API_KEY
        sync: false
      - key: PAYVESSEL_API_SECRET
        sync: false
      - key: PAYVESSEL_BUSINESS_ID
        sync: false

  # ── Celery Worker ────────────────────────────────────────────────────────
  - type: worker
    name: coop-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A config worker -l info --concurrency 2
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: coop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: coop-redis
          type: redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: PAYVESSEL_BASE_URL
        sync: false
      - key: PAYVESSEL_API_KEY
        sync: false
      - key: PAYVESSEL_API_SECRET
        sync: false
      - key: PAYVESSEL_BUSINESS_ID
        sync: false

  # ── Celery Beat ──────────────────────────────────────────────────────────
  - type: worker
    name: coop-beat
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: coop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: coop-redis
          type: redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: PAYVESSEL_BASE_URL
        sync: false
      - key: PAYVESSEL_API_KEY
        sync: false
      - key: PAYVESSEL_API_SECRET
        sync: false
      - key: PAYVESSEL_BUSINESS_ID
        sync: false

  # ── Redis ────────────────────────────────────────────────────────────────
  - type: redis
    name: coop-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []  # internal only — only Render services in this account can connect

databases:
  # ── Postgres ─────────────────────────────────────────────────────────────
  - name: coop-db
    plan: free
    databaseName: coop_db
    user: coop_user
