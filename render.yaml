# render.yaml — Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy steps:
#   1. Push this repo to GitHub/GitLab.
#   2. In Render dashboard → New → Blueprint → connect your repo.
#   3. Render reads this file and creates all services automatically.
#   4. Set the secret environment variables marked `sync: false` in the
#      Render dashboard (they are NOT stored in this file):
#        - DJANGO_SECRET_KEY
#        - FIELD_ENCRYPTION_KEY
#        - PAYVESSEL_API_KEY
#        - PAYVESSEL_API_SECRET
#        - PAYVESSEL_BUSINESS_ID
#        - PAYVESSEL_BASE_URL  (use https://api.payvessel.com for production)

services:
  # ── Web (Django + Gunicorn) ──────────────────────────────────────────────
  - type: web
    name: coop-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Pre-deploy: runs migrate before each new version goes live.
    # setup_roles is idempotent — safe to run on every deploy.
    preDeployCommand: >-
      python manage.py migrate --noinput &&
      python manage.py setup_roles
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"   # update to your custom domain if you add one
      - key: COOPERATIVE_SHORT_NAME
        value: AL-HALAL
      - key: DATABASE_URL
        fromDatabase:
          name: coop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: coop-redis
          type: redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: PAYVESSEL_BASE_URL
        sync: false
      - key: PAYVESSEL_API_KEY
        sync: false
      - key: PAYVESSEL_API_SECRET
        sync: false
      - key: PAYVESSEL_BUSINESS_ID
        sync: false

  # ── Celery Worker ────────────────────────────────────────────────────────
  - type: worker
    name: coop-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A config worker -l info --concurrency 2
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: coop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: coop-redis
          type: redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: PAYVESSEL_BASE_URL
        sync: false
      - key: PAYVESSEL_API_KEY
        sync: false
      - key: PAYVESSEL_API_SECRET
        sync: false
      - key: PAYVESSEL_BUSINESS_ID
        sync: false

  # ── Celery Beat ──────────────────────────────────────────────────────────
  - type: worker
    name: coop-beat
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: coop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: coop-redis
          type: redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: PAYVESSEL_BASE_URL
        sync: false
      - key: PAYVESSEL_API_KEY
        sync: false
      - key: PAYVESSEL_API_SECRET
        sync: false
      - key: PAYVESSEL_BUSINESS_ID
        sync: false

  # ── Redis ────────────────────────────────────────────────────────────────
  - type: redis
    name: coop-redis
    plan: free
    maxmemoryPolicy: noeviction

databases:
  # ── Postgres ─────────────────────────────────────────────────────────────
  - name: coop-db
    plan: free
    databaseName: coop_db
    user: coop_user
