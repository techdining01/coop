# Place at /etc/nginx/sites-available/coopapp on the VPS, symlink into
# sites-enabled, then run certbot for SSL. This file assumes Certbot has
# already added the SSL server block on port 443 (via `certbot --nginx`);
# what's below is the base HTTP->proxy config it will modify in place.

server {
    listen 80;
    server_name your-domain-or-subdomain.example.com;

    client_max_body_size 10M;  # receipt uploads (Phase 2) — photos/PDFs

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/mediafiles/;
    }

    # Service worker must be served with no aggressive caching, or updates
    # to it won't reach installed PWA clients promptly.
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
